services:
  # Node.js Express Backend — runs as a Docker container (see HACKATHON/backend/Dockerfile)
  - type: web
    name: e-kishaan-backend
    env: docker
    dockerfilePath: HACKATHON/backend/Dockerfile
    dockerContext: HACKATHON/backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # ── Set these manually in the Render dashboard (Environment tab) ──
      # sync: false means Render will prompt for a value on first deploy
      # and never overwrite it from this file (so secrets aren't committed).
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 30d
      - key: FRONTEND_URL
        sync: false # e.g. https://your-app.vercel.app
      - key: ML_BACKEND_URL
        sync: false # the e-kishaan-ml-backend service's URL, once deployed
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false

  # Python FastAPI ML Microservice — unchanged, stays on Render's native
  # Python runtime (already deploys successfully; Dockerizing it wasn't
  # requested and adds no benefit here).
  - type: web
    name: e-kishaan-ml-backend
    env: python
    rootDir: HACKATHON/ml_backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000
