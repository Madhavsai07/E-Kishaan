name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HACKATHON/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: HACKATHON/frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run lint
      - run: npm run build
        env:
          # Dummy values so the build can validate env.ts without secrets in CI.
          VITE_API_URL: https://ci-placeholder.example.com
          VITE_ML_BACKEND_URL: https://ci-placeholder.example.com

  backend:
    name: Backend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HACKATHON/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: HACKATHON/backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  backend-docker:
    name: Backend (Docker build)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push — just verifies the Dockerfile builds)
        uses: docker/build-push-action@v5
        with:
          context: HACKATHON/backend
          file: HACKATHON/backend/Dockerfile
          push: false
          tags: ekishaan-backend:ci

  ml-backend:
    name: ML backend (install + import smoke check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HACKATHON/ml_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: HACKATHON/ml_backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Import smoke check
        run: python -c "import main; print('✅ main.py imports cleanly')"
