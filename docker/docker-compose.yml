services:
  mongodb:
    image: mongo:7
    container_name: ekishaan-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ../HACKATHON/backend
      dockerfile: Dockerfile
    container_name: ekishaan-backend
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/ekishaan
      JWT_ACCESS_SECRET: local-dev-access-secret-change-me-please-32chars
      JWT_REFRESH_SECRET: local-dev-refresh-secret-change-me-please-32chars
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 30d
      FRONTEND_URL: http://localhost:5173
      ML_BACKEND_URL: http://host.docker.internal:8000

volumes:
  mongo-data:
